services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphrag2026
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphrag2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  app:
    build: .
    profiles: ["app"]          # docker compose --profile app up
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
